<script>
(function () {
  var path = location.pathname;
  var lang = /^\/pt(\/|$)/.test(path) ? 'pt' : (/^\/es(\/|$)/.test(path) ? 'es' : 'en');
  var homes = { en: '/', pt: '/pt/', es: '/es/' };

  var copy = {
    en: {
      title: 'Imaginne Lab · Page Not Found',
      tagline: '3D Printing',
      eyebrow: '404 error',
      heading: 'This page wandered off.',
      lede: "The page you're looking for doesn't exist, or the link is broken. Let's get you back on track.",
      cta: 'Back to Home'
    },
    pt: {
      title: 'Imaginne Lab · Página Não Encontrada',
      tagline: 'Impressão 3D',
      eyebrow: 'Erro 404',
      heading: 'Essa página se perdeu por aí.',
      lede: 'A página que você procura não existe, ou o link está quebrado. Vamos te levar de volta.',
      cta: 'Voltar para o início'
    },
    es: {
      title: 'Imaginne Lab · Página No Encontrada',
      tagline: 'Impresión 3D',
      eyebrow: 'Error 404',
      heading: 'Esta página se perdió por ahí.',
      lede: 'La página que buscas no existe, o el enlace está roto. Vamos a llevarte de vuelta.',
      cta: 'Volver al inicio'
    }
  };

  var t = copy[lang];
  document.documentElement.setAttribute('lang', lang === 'pt' ? 'pt-BR' : lang);
  document.title = t.title;

  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  document.getElementById('error-home-link').setAttribute('href', homes[lang]);
  document.querySelectorAll('.brand').forEach(function (el) { el.setAttribute('href', homes[lang]); });
  document.querySelectorAll('.lang-link').forEach(function (el) {
    el.classList.toggle('is-active', el.getAttribute('data-lang') === lang);
  });
})();
</script>
